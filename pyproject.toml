[project]
name = "ai-course"
version = "0.1.0"
description = "Nimbus: a production-grade AI service, and the course that builds it."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1,<0.142",
    "fastembed>=0.8.1",
    "langchain>=1.4.3",
    "langchain-classic>=1.0.8",
    "langchain-mistralai>=1.1.6",
    "langchain-core>=1.6.6",
    "langchain-postgres>=0.0.18",
    "langchain-text-splitters>=1.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-community>=0.4.2",
    "ddgs>=9.16.0",
    "fastmcp[tasks]>=4.0.10",
    "sqlglot>=30.21.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "pdfplumber>=0.11.10",
    "docx2txt>=0.9",
    "lxml>=6.1.3",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "tiktoken>=0.14.0",
    "faiss-cpu>=1.15.1",
    "langchain-chroma>=1.1.0",
    "flashrank>=0.2.10",
    "langchain-qdrant>=1.1.0",
    "networkx>=3.7",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pycryptodome>=3.24.1",
    "langgraph-cli[inmem]>=0.4.33",
    "deepagents>=0.7.23",
    "pandas>=3.0.6",
    "matplotlib>=3.11.2",
    "duckdb>=1.5.6",
    "sqlmodel>=0.0.48",
    "pwdlib[argon2]>=0.3.1",
    "rq>=2.12.0",
    "openevals>=0.2.0",
    "agentevals>=0.0.9",
    "structlog>=25.5.0",
    "prometheus-client>=0.26.0",
]

[project.scripts]
nimbus = "nimbus.cli:entry"
academy = "academy.web.app:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "vcrpy>=8.3.0",
]

[tool.uv.build-backend]
module-name = ["nimbus", "academy"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
indent-width = 2

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs the Postgres container (docker compose up -d)",
  "integration: calls a real model (uv run pytest -m integration)",
]
addopts = "-m 'not integration'"
